name: CI

on:
  push:
    branches: [v3, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, build, docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:docs

  e2e:
    name: playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - name: component tests
        run: npx playwright test --project=${{ matrix.project }}
      # runs even when the component step failed, so one failure cannot hide the
      # other suite's result — and dropping this step is a visible diff here
      - name: docs smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright test --config=playwright.docs.config.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          # the test-results directories hold the screenshots, traces and error
          # context the HTML reports link to
          path: |
            playwright-report/
            playwright-report-docs/
            test-results/
            test-results-docs/
          retention-days: 14
